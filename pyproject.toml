[project]
name = "kisan-dost"
version = "0.1.0"
description = "AI agronomy agent for Pakistani farmers - Terminal Agent Challenge"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Kisan Dost Team"}]
keywords = ["ai", "agents", "agriculture", "pakistan", "farmers"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "openai-agents>=0.0.1",
    "pydantic>=2.8",
    "pydantic-settings>=2.3",
    "rich>=13.7",
    "click>=8.1",
    "pandas>=2.2",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "loguru>=0.7",
    "tenacity>=8.3",
    "orjson>=3.10",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
]
api = [
    "openai>=1.35",
    "google-generativeai>=0.7",
    "groq>=0.11",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "gunicorn>=23.0",
]
db = [
    "aiosqlite>=0.19",
    "redis>=5.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
]

[project.scripts]
kisan-dost = "kisan_dost.cli.main:main"

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "W", "UP", "B", "C4", "PT", "RUF", "SIM", "TID", "TRY"]
ignore = ["S101", "TRY003"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.setuptools.packages.find]
where = ["."]
include = ["cli*", "data*", "agents*", "config*", "models*", "tracing*", "services*", "sessions*", "guardrails*", "tools*", "scripts*", "tests*"]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"